<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="820" viewBox="0 0 1150 820">
  <title>v3.0 培养芯片 + 独立检测模块 两件套示意图（分离视图）</title>

  <rect x="0" y="0" width="1150" height="820" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="575" y="38" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a2e">细胞代谢监测系统 — 两件套设计 v3.0</text>
  <text x="575" y="58" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle" fill="#666">两个独立物理单元，外置软管闭环连接（均为可拆装的独立器件）</text>

  <!-- ============================================================
       左：培养芯片（独立物理块，绿色虚线框标识）
       ============================================================ -->
  <rect x="60" y="85" width="430" height="355" rx="10" ry="10" fill="#eaf6ee" stroke="#4caf50" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="275" y="108" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">物理块 A：培养芯片（一个整块，一次性加工/可拆装）</text>

  <!-- 上盖层 -->
  <path d="M155,128 L395,128 L395,168 L155,168 Z" fill="#dbe4ee" stroke="#7c8b9d" stroke-width="2"/>
  <!-- 培养井左右壁 -->
  <rect x="155" y="168" width="70" height="140" fill="#dbe4ee" stroke="#7c8b9d" stroke-width="2"/>
  <rect x="330" y="168" width="65" height="140" fill="#dbe4ee" stroke="#7c8b9d" stroke-width="2"/>
  <!-- 培养井腔（培养基） -->
  <rect x="225" y="168" width="105" height="140" fill="#bcd9f2" stroke="#5b8bb8" stroke-width="2"/>
  <!-- 细胞 -->
  <circle cx="245" cy="220" r="6" fill="#e0533d"/>
  <circle cx="280" cy="255" r="6" fill="#e0533d"/>
  <circle cx="315" cy="215" r="6" fill="#e0533d"/>

  <!-- 多孔膜 -->
  <rect x="215" y="308" width="125" height="7" fill="#f2a63d" stroke="#c97f1a" stroke-width="1"/>
  <circle cx="232" cy="311.5" r="1.3" fill="#ffffff"/><circle cx="255" cy="311.5" r="1.3" fill="#ffffff"/>
  <circle cx="278" cy="311.5" r="1.3" fill="#ffffff"/><circle cx="301" cy="311.5" r="1.3" fill="#ffffff"/>
  <circle cx="324" cy="311.5" r="1.3" fill="#ffffff"/>

  <!-- 下腔板 -->
  <rect x="155" y="315" width="240" height="80" fill="#e4e8ee" stroke="#8a97a8" stroke-width="2"/>
  <!-- 下腔（膜下小体积） -->
  <rect x="220" y="315" width="115" height="40" fill="#fff2c9" stroke="#d9b95c" stroke-width="2"/>
  <!-- 代谢物透过箭头 -->
  <polygon points="277,316 271,323 277,321 283,323" fill="#c79a2b"/>

  <!-- 进出液口（下腔板侧壁突出，带快插接头） -->
  <rect x="135" y="327" width="22" height="16" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="393" y="327" width="22" height="16" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="146" y="340" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">出</text>
  <text x="404" y="340" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">入</text>

  <!-- 培养芯片标注 -->
  <text x="170" y="150" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334455">上盖层</text>
  <text x="228" y="186" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1b3a5c">培养井（细胞）</text>
  <text x="348" y="313" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7a4d05">多孔膜</text>
  <text x="230" y="342" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#7a5b00">下腔（小体积）</text>
  <text x="170" y="372" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#556677">下腔板</text>

  <!-- 加药口（上盖） -->
  <rect x="273" y="115" width="10" height="53" fill="#ffffff" stroke="#556677" stroke-width="1.5"/>
  <circle cx="278" cy="115" r="11" fill="#ffffff" stroke="#556677" stroke-width="2"/>
  <text x="278" y="119" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334455" text-anchor="middle" font-weight="bold">+</text>

  <!-- 培养芯片独有特性标注（右下角） -->
  <rect x="165" y="397" width="215" height="36" rx="6" fill="#ffffff" stroke="#4caf50" stroke-width="1.5"/>
  <text x="272" y="412" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#2e7d32" text-anchor="middle">★ 芯片独有：膜下小体积腔 + 闭环循环接口</text>
  <text x="272" y="426" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#666" text-anchor="middle">（普通培养芯片没有下腔和循环口）</text>

  <!-- ============================================================
       中间：外置软管 + 分隔标注
       ============================================================ -->
  <!-- 大分隔竖线 -->
  <line x1="508" y1="85" x2="508" y2="440" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="512" y1="85" x2="512" y2="440" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- 外置软管（两条，蓝色实心粗线，表示这是管子不是芯片内部流道） -->
  <!-- 出液软管：培养芯片出 → 检测模块微泵入 -->
  <path d="M135,335 Q80,335 80,260 L80,260 Q80,250 90,250 L590,250" stroke="#2196f3" stroke-width="4" fill="none"/>
  <!-- 入液软管：检测模块三通 → 培养芯片入 -->
  <path d="M972,280 Q1070,280 1070,335" stroke="#2196f3" stroke-width="4" fill="none"/>
  <path d="M1070,335 Q1070,370 415,335" stroke="#2196f3" stroke-width="4" fill="none"/>

  <!-- 软管标注 -->
  <text x="75" y="295" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1565c0" transform="rotate(-90, 75, 295)">外置软管（φ1~2 mm）</text>
  <text x="1095" y="360" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1565c0" transform="rotate(90, 1095, 360)">外置软管（φ1~2 mm）</text>

  <!-- 中间大括号标注"两个物理块在这里分开" -->
  <text x="510" y="260" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e65100" text-anchor="middle" font-weight="bold">≠ 一体</text>
  <text x="510" y="278" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#e65100" text-anchor="middle">→ 软管连接</text>

  <!-- ============================================================
       右：独立检测模块（独立物理块，橙色虚线框标识）
       ============================================================ -->
  <rect x="550" y="85" width="540" height="355" rx="10" ry="10" fill="#fff4e5" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="820" y="108" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">物理块 B：独立检测模块（即插即用，坏了只换这个）</text>

  <!-- 电极流道 -->
  <rect x="580" y="135" width="310" height="50" rx="6" fill="#bcd9f2" stroke="#5b8bb8" stroke-width="2"/>
  <!-- 电极条 -->
  <rect x="605" y="148" width="195" height="24" fill="#3f4a55"/>
  <rect x="605" y="148" width="105" height="24" fill="#e9b93b"/>
  <!-- 电极端子外伸 -->
  <rect x="800" y="148" width="28" height="24" fill="#3f4a55"/>
  <text x="587" y="165" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1b3a5c">电极流道</text>
  <text x="657" y="163" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#6b4d00" text-anchor="middle">检测区</text>
  <text x="835" y="163" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677">→ 恒电位仪</text>

  <!-- 气泡阱 -->
  <rect x="910" y="135" width="45" height="50" rx="6" fill="#ffffff" stroke="#8a97a8" stroke-width="2"/>
  <circle cx="932" cy="150" r="4" fill="#ffffff" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="932" y="198" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#556677" text-anchor="middle">气泡阱</text>

  <!-- 三通阀 -->
  <circle cx="930" cy="255" r="20" fill="#ffffff" stroke="#3f4a55" stroke-width="2"/>
  <text x="930" y="259" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#3f4a55" text-anchor="middle">三通</text>
  <text x="930" y="283" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#556677" text-anchor="middle">循环/校准</text>

  <!-- 微泵 -->
  <rect x="580" y="245" width="65" height="36" rx="6" fill="#3f4a55"/>
  <text x="612" y="260" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">微泵</text>
  <text x="612" y="273" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#cfd8e3" text-anchor="middle">50~100 μL/min</text>

  <!-- 标准液瓶 -->
  <rect x="710" y="235" width="48" height="55" fill="#ffffff" stroke="#7c8b9d" stroke-width="2"/>
  <rect x="718" y="227" width="32" height="9" fill="#7c8b9d"/>
  <text x="734" y="265" font-family="Microsoft YaHei, sans-serif" font-size="8.5" fill="#556677" text-anchor="middle">标准液</text>
  <text x="734" y="276" font-family="Microsoft YaHei, sans-serif" font-size="8.5" fill="#556677" text-anchor="middle">（校准用）</text>

  <!-- 检测模块内部流道（实线，表示这是模块内部的流路，不是芯片的） -->
  <!-- 微泵出 → 电极流道入（模块内部） -->
  <path d="M645,263 L645,210 Q645,185 580,160" stroke="#5b8bb8" stroke-width="2.5" fill="none"/>
  <!-- 电极流道出 → 气泡阱 → 三通（模块内部） -->
  <path d="M890,160 L910,160" stroke="#5b8bb8" stroke-width="2.5" fill="none"/>
  <path d="M932,185 L932,235" stroke="#5b8bb8" stroke-width="2.5" fill="none"/>
  <!-- 标准液 → 三通 -->
  <path d="M758,255 L910,255" stroke="#c97f1a" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <!-- 三通排废 -->
  <path d="M945,263 L975,263 L975,245" stroke="#c97f1a" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <text x="980" y="248" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#c97f1a">排废</text>

  <!-- 检测模块独有特性标注（右下角） -->
  <rect x="660" y="368" width="320" height="56" rx="6" fill="#ffffff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="820" y="386" font-family="Microsoft YaHei, sans-serif" font-size="10.5" fill="#e65100" text-anchor="middle">★ 模块独有：泵阀 + 电极流道 + 校准支路</text>
  <text x="820" y="402" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#666" text-anchor="middle">（可插拔，电极坏了/要换指标只换这个，不碰培养芯片）</text>
  <text x="820" y="418" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#e0533d" text-anchor="middle">校准液绝不回流细胞腔（核心隔离）</text>

  <!-- ============================================================
       底部：测量协议 + 系统级创新点（区别于别人的地方）
       ============================================================ -->
  <rect x="40" y="470" width="1070" height="315" rx="12" ry="12" fill="#f6f8fa" stroke="#d5dbe2" stroke-width="1"/>
  <text x="62" y="498" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">测量协议（一个周期 ≈ 1 个浓度点，10~15 min / 点 × 12~72 h）</text>

  <!-- 协议步骤横排 -->
  <rect x="62" y="515" width="215" height="55" rx="6" fill="#dbe4ee" stroke="#7c8b9d" stroke-width="1.5"/>
  <text x="170" y="536" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#2b3540" text-anchor="middle">① 循环均质</text>
  <text x="170" y="554" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">泵开，均质下腔 + 冲洗电极</text>

  <polygon points="285,542 298,535 298,549" fill="#7c8b9d"/>

  <rect x="305" y="515" width="215" height="55" rx="6" fill="#fff2c9" stroke="#d9b95c" stroke-width="1.5"/>
  <text x="413" y="536" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#7a5b00" text-anchor="middle">② 停流平衡</text>
  <text x="413" y="554" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">泵停，膜上下跨膜 ~5-15 min</text>

  <polygon points="528,542 541,535 541,549" fill="#7c8b9d"/>

  <rect x="548" y="515" width="215" height="55" rx="6" fill="#bcd9f2" stroke="#5b8bb8" stroke-width="1.5"/>
  <text x="656" y="536" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#1b3a5c" text-anchor="middle">③ 静测读数</text>
  <text x="656" y="554" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">30-60 s 安培法 → 1 个浓度点</text>

  <polygon points="771,542 784,535 784,549" fill="#7c8b9d"/>

  <rect x="791" y="515" width="230" height="55" rx="6" fill="#e9b93b" stroke="#c99730" stroke-width="1.5"/>
  <text x="906" y="536" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#6b4d00" text-anchor="middle">④ 周期校准（每 6 h）</text>
  <text x="906" y="554" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">三通切标准液 → 更新灵敏度</text>

  <!-- 分割线 -->
  <line x1="62" y1="590" x2="1040" y2="590" stroke="#d5dbe2" stroke-width="1"/>

  <!-- 系统级创新点（区别于别人） -->
  <text x="62" y="615" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e">与现有"外置电极检测"系统的核心区别（创新在系统集成，不是单个部件）：</text>

  <rect x="62" y="628" width="320" height="70" rx="6" fill="#eaf6ee" stroke="#4caf50" stroke-width="1.5"/>
  <text x="222" y="646" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">① 膜下小体积腔 + 闭环微循环</text>
  <text x="222" y="664" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">不是"电极直接泡培养液"或"取样到外置池"</text>
  <text x="222" y="680" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">膜隔开细胞，电极不碰细胞，循环防浓度梯度</text>

  <rect x="400" y="628" width="320" height="70" rx="6" fill="#fff4e5" stroke="#ff9800" stroke-width="1.5"/>
  <text x="560" y="646" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#e65100" text-anchor="middle">② 停流静测 + 在线自校准协议</text>
  <text x="560" y="664" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">不是"实验前校准一次到底"</text>
  <text x="560" y="680" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">每 6 h 自动校准，漂移可追溯，定量可信</text>

  <rect x="738" y="628" width="305" height="70" rx="6" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5"/>
  <text x="890" y="646" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">③ AIoT 远程监控 + 自动报告</text>
  <text x="890" y="664" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">不是"本地看数据"</text>
  <text x="890" y="680" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#556677" text-anchor="middle">手机远程看曲线、异常告警、实验结束自动出 PDF</text>

  <text x="62" y="725" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#556677">注：本图为原理示意图，尺寸未按真实比例；密封、支撑等工程细节略（方法可行性验证即可）</text>
</svg>
