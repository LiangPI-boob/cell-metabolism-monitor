<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoStat · 参数</title>
  <link rel="stylesheet" href="assets/app.css">
</head>

<body data-page="setup">
  <nav class="nav">
    <span class="nav__brand">NanoStat</span>
    <a class="nav__link" href="index.html">控制台</a>
    <a class="nav__link is-active" href="setup.html">参数</a>
    <a class="nav__link" href="system.html">系统</a>
    <a class="nav__link" href="help.html">帮助</a>
  </nav>

  <main class="page">
    <header class="page__head">
      <h1>扫描参数</h1>
      <p class="page__sub">按扫描模式分组；点击「保存参数」后一次性写入主机。</p>
    </header>

    <form action="/actionpage.html" method="POST">
      <details class="group" open>
        <summary>通用</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="sweep-param-lmp-gain">TIA 增益</label>
              <select id="sweep-param-lmp-gain" name="sweep_param_lmpGain">
                <option value="7">350 kOhm</option>
                <option value="6">120 kOhm</option>
                <option value="5">35 kOhm</option>
                <option value="4">14 kOhm</option>
                <option value="3">7 kOhm</option>
                <option value="2">3.5 kOhm</option>
                <option value="1">2.75 kOhm</option>
                <option value="0">外部电阻</option>
              </select>
            </div>
            <div class="field">
              <span class="field__label">扫描结束后归零</span>
              <div class="row">
                <label class="choice">
                  <input type="radio" name="sweep_param_setToZero" value="true" checked> 归零
                </label>
                <label class="choice">
                  <input type="radio" name="sweep_param_setToZero" value="false"> 保持
                </label>
              </div>
            </div>
          </div>
          <p class="field__hint">TIA 增益需保证 −0.75 V &lt; VTIA &lt; 1 V，详细限制见帮助页。</p>
        </div>
      </details>

      <details class="group" id="cv">
        <summary>CV 循环伏安</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="cycles-cv">循环次数</label>
              <input type="number" id="cycles-cv" name="sweep_param_cycles_CV" value="3" min="1">
            </div>
            <div class="field">
              <label class="field__label" for="startv-cv">起始电压（mV）</label>
              <input type="number" id="startv-cv" name="sweep_param_startV_CV" value="0" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="endv-cv">终止电压（mV）</label>
              <input type="number" id="endv-cv" name="sweep_param_endV_CV" value="0" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="v1-cv">最高电压（mV）</label>
              <input type="number" id="v1-cv" name="sweep_param_vertex1_CV" value="100" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="v2-cv">最低电压（mV）</label>
              <input type="number" id="v2-cv" name="sweep_param_vertex2_CV" value="-100" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="stepv-cv">步进电压（mV）</label>
              <input type="number" id="stepv-cv" name="sweep_param_stepV_CV" value="5" min="1" max="100">
            </div>
            <div class="field">
              <label class="field__label" for="rate-cv">扫描速率（mV/s）</label>
              <input type="number" id="rate-cv" name="sweep_param_rate_CV" value="100" min="1" max="10000">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="npv">
        <summary>NPV 常规脉冲伏安</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="startv-npv">起始电压（mV）</label>
              <input type="number" id="startv-npv" name="sweep_param_startV_NPV" value="-200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="endv-npv">终止电压（mV）</label>
              <input type="number" id="endv-npv" name="sweep_param_endV_NPV" value="200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="pulseamp-npv">脉冲幅度（mV）</label>
              <input type="number" id="pulseamp-npv" name="sweep_param_pulseAmp_NPV" value="20" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="width-npv">脉冲宽度（ms）</label>
              <input type="number" id="width-npv" name="sweep_param_width_NPV" value="50" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="period-npv">脉冲周期（ms）</label>
              <input type="number" id="period-npv" name="sweep_param_period_NPV" value="200" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="quiet-npv">静置时间（ms）</label>
              <input type="number" id="quiet-npv" name="sweep_param_quietTime_NPV" value="1000" min="1" max="100000">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="dpv">
        <summary>DPV 差分脉冲伏安</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="startv-dpv">起始电压（mV）</label>
              <input type="number" id="startv-dpv" name="sweep_param_startV_DPV" value="-200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="endv-dpv">终止电压（mV）</label>
              <input type="number" id="endv-dpv" name="sweep_param_endV_DPV" value="200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="pulseamp-dpv">脉冲幅度（mV）</label>
              <input type="number" id="pulseamp-dpv" name="sweep_param_pulseAmp_DPV" value="20" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="pulsestep-dpv">脉冲步进（mV）</label>
              <input type="number" id="pulsestep-dpv" name="sweep_param_pulseStep_DPV" value="20" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="width-dpv">脉冲宽度（ms）</label>
              <input type="number" id="width-dpv" name="sweep_param_width_DPV" value="50" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="period-dpv">脉冲周期（ms）</label>
              <input type="number" id="period-dpv" name="sweep_param_period_DPV" value="200" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="quiet-dpv">静置时间（ms）</label>
              <input type="number" id="quiet-dpv" name="sweep_param_quietTime_DPV" value="1000" min="1" max="100000">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="swv">
        <summary>SWV 方波伏安</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="startv-swv">起始电压（mV）</label>
              <input type="number" id="startv-swv" name="sweep_param_startV_SWV" value="-200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="endv-swv">终止电压（mV）</label>
              <input type="number" id="endv-swv" name="sweep_param_endV_SWV" value="200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="pulseamp-swv">脉冲幅度（mV）</label>
              <input type="number" id="pulseamp-swv" name="sweep_param_pulseAmp_SWV" value="20" min="1" max="200">
            </div>
            <div class="field">
              <label class="field__label" for="stepv-swv">步进电压（mV）</label>
              <input type="number" id="stepv-swv" name="sweep_param_stepV_SWV" value="5" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="freq-swv">频率（Hz）</label>
              <input type="number" id="freq-swv" name="sweep_param_freq_SWV" value="10" min="1" max="100000">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="ca">
        <summary>CA 计时电流</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="prestepv-ca">初始电压（mV）</label>
              <input type="number" id="prestepv-ca" name="sweep_param_pre_stepV_CA" value="50" min="1" max="1000">
            </div>
            <div class="field">
              <label class="field__label" for="quiet-ca">静置时间（ms）</label>
              <input type="number" id="quiet-ca" name="sweep_param_quietTime_CA" value="2000" min="1" max="100000">
            </div>
            <div class="field">
              <label class="field__label" for="v1-ca">第一阶跃电压（mV）</label>
              <input type="number" id="v1-ca" name="sweep_param_V1_CA" value="50" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="t1-ca">第一阶跃时长（ms）</label>
              <input type="number" id="t1-ca" name="sweep_param_t1_CA" value="2000" min="1" max="100000">
            </div>
            <div class="field">
              <label class="field__label" for="v2-ca">第二阶跃电压（mV）</label>
              <input type="number" id="v2-ca" name="sweep_param_V2_CA" value="50" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="t2-ca">第二阶跃时长（ms）</label>
              <input type="number" id="t2-ca" name="sweep_param_t2_CA" value="2000" min="1" max="100000">
            </div>
            <div class="field">
              <label class="field__label" for="samples-ca">每阶跃采样数</label>
              <input type="number" id="samples-ca" name="sweep_param_samples_CA" value="100" min="1" max="1666">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="iv">
        <summary>IV 曲线</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="startv-iv">起始电压（mV）</label>
              <input type="number" id="startv-iv" name="sweep_param_startV_IV" value="-200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="endv-iv">终止电压（mV）</label>
              <input type="number" id="endv-iv" name="sweep_param_endV_IV" value="200" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="delay-iv">点间延时（ms）</label>
              <input type="number" id="delay-iv" name="sweep_param_delayTime_ms_IV" value="50" min="1" max="1000000">
            </div>
            <div class="field">
              <label class="field__label" for="points-iv">点数（最多 5000）</label>
              <input type="number" id="points-iv" name="sweep_param_numPoints_IV" value="701" min="1" max="6000">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="dc">
        <summary>DC 直流偏置噪声</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="bias-dc">偏置电压（mV）</label>
              <input type="number" id="bias-dc" name="sweep_param_biasV_noisetest" value="100" min="-600" max="600">
            </div>
            <div class="field">
              <label class="field__label" for="points-dc">点数</label>
              <input type="number" id="points-dc" name="sweep_param_numPoints_noisetest" value="100" min="1" max="100000">
            </div>
            <div class="field">
              <label class="field__label" for="delay-dc">点间延时（ms）</label>
              <input type="number" id="delay-dc" name="sweep_param_delayTime_ms_noisetest" value="50" min="1" max="1000000">
            </div>
          </div>
        </div>
      </details>

      <details class="group" id="cal">
        <summary>Cal 校准</summary>
        <div class="group__body">
          <div class="grid--2">
            <div class="field">
              <label class="field__label" for="delay-cal">点间延时（ms）</label>
              <input type="number" id="delay-cal" name="sweep_param_delayTime_ms_CAL" value="50" min="1" max="1000000">
            </div>
          </div>
          <p class="field__hint">校准时需将 WE 与 RE/CE 断开（短接 RE/CE），结果写入 flash 并掉电保存。</p>
        </div>
      </details>

      <div class="form-actions">
        <button type="reset" class="btn btn--ghost">恢复默认值</button>
        <button type="submit" class="btn btn--primary">保存参数</button>
      </div>
    </form>
  </main>

  <footer class="foot">NanoStat Firmware Rev. 1.0 · BurkeLab</footer>
  <script src="assets/app.js"></script>
</body>

</html>
